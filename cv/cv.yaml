# No first-person pronouns anywhere in the CV.
#
# Sentence one is the whole positioning: tooling other engineers adopt, plus the
# product surface on top. Sentence two is the evidence for it, and it leads with
# the adoption because that is social proof from engineers rather than a
# self-assessment — the strongest single claim available. Do not soften it back
# into "software engineer building SaaS application software", which was true of
# a hundred thousand people.
# The adoption phrasing here must stay in step with the first EXPERIENCE bullet.
# They said different things for a while ("across the engineering team" here vs
# beyond it there), which is exactly the CV-vs-itself contradiction to avoid.
profile: >-
  Software engineer who builds the AI agent tooling other engineers adopt, and
  ships the product frontend on top of it. Wrote the Go MCP server now used
  beyond engineering — by product and non-technical business teams — to connect
  AI agents to the company's task tracker, with two more shipped: one inside a
  commercial product, one a 41-tool personal system. Strongest on production
