# ── Presentation ───────────────────────────────────────────────────────────
# These settings came out of a comparison against rendercv (see README.md,
# "Why not rendercv"). Each is free in vertical space, so none of them
# threatens the one-page budget.
design:
  # sans-local | serif-local | inter-webfont
  #
  # A LOCALLY INSTALLED font embeds as CID TrueType. The webfont embeds as
  # Type 3, is ~2x the file size, and needs the network at render time. So the
  # two `-local` options are strictly better; `inter-webfont` only exists to
  # reproduce the pre-2026-08 CV exactly (with justify and center_header off).
  font: serif-local

  # Justified body text, as in rendercv's themes. Costs nothing vertically.
  justify: true

  # LEAVE THIS FALSE. Verified: Chrome's automatic hyphenation breaks words in
  # the TEXT LAYER using U+2010, not a soft hyphen — "products" extracted as
  # "prod‐ucts", "migration" as "mi‐gration". A keyword search for the whole word
  # then fails, which is the parse degradation research.md exists to avoid.
  # Loose word spacing is the cheaper price.
  hyphenate: false

  # Centre the name and contact block. Purely presentational, costs no space.
  center_header: true
