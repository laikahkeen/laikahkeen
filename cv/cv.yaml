# ═══════════════════════════════════════════════════════════════════════════
# CV content — the single source of truth.
#
# This file holds WHAT the CV says. It says nothing about how it looks.
# Two renderers consume it:
#
#   scripts/cv-render.py       -> HTML -> PDF   (full fidelity, R4)
#   scripts/cv-to-rendercv.py  -> rendercv YAML (lossy, see that script, R2)
#
# Inline emphasis: **bold** works in bullets and values. Both renderers
# understand it. Nothing else is markup — write plain prose.
#
# Before editing, read README.md. The constraints there are evidence from
# primary sources (cited in research.md), not house style. In particular:
# bullets are two lines maximum and open with a verb, and the page budget is
# one page with almost no slack — pay for overflow with content, never with
# font size or margins.
# ═══════════════════════════════════════════════════════════════════════════

