<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found - Lai Kah Keen</title>

    <!-- Served by GitHub Pages at whatever path missed, so every URL is absolute.
         No Tailwind here: colours are palette values, pinned by src/notFound.test.ts. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #ffffff;
        color: #000000;
        font-family: 'JetBrains Mono', monospace;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      .wrap {
        margin: 0 auto;
        padding: 0 1.5rem;
      }
      header .wrap {
        max-width: 80rem;
        height: 5rem;
        display: flex;
        align-items: center;
      }
      .brand {
        font-size: 1.25rem;
        font-weight: 600;
        text-decoration: none;
      }
      .brand:hover {
        color: #525252;
      }
      main .wrap {
        max-width: 48rem;
        padding-top: 3rem;
        padding-bottom: 6rem;
      }
      .eyebrow {
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #737373;
      }
      h1 {
        margin-top: 1rem;
        font-size: 1.875rem;
        line-height: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }
      p.lede {
        margin-top: 1rem;
        color: #525252;
      }
      .links {
        margin-top: 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
      }
      .links a {
        text-underline-offset: 4px;
      }
      .links a:hover {
        color: #525252;
      }
      @media (min-width: 1024px) {
        .wrap {
          padding-left: 2rem;
          padding-right: 2rem;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="wrap">
        <a class="brand" href="/">LKK</a>
      </div>
    </header>

    <main>
      <div class="wrap">
        <p class="eyebrow">404</p>
        <h1>Page not found</h1>
        <p class="lede">Nothing is published at this address. If a link brought you here, it is probably out of date.</p>
        <div class="links">
          <a href="/">Home</a>
          <a href="/#projects">See my work →</a>
        </div>
      </div>
    </main>
  </body>
</html>
